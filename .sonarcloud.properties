# SonarCloud Automatic Analysis configuration.
#
# Test files are excluded from copy-paste detection only: they are still
# analysed for bugs, vulnerabilities and security hotspots. Integration suites
# repeat setup on purpose (each one boots its own compiled API and fixtures),
# so their duplication is not product debt. Owner decision, 2026-11-09.
sonar.cpd.exclusions=**/*.spec.ts,**/*.integration-spec.ts,**/*.e2e-spec.ts,**/test/**

# Prisma migrations are generated PostgreSQL DDL (ADR-DAT-016). Sonar reads
# .sql as Oracle PL/SQL (it asks for VARCHAR2) and DDL repeats by nature, so
# they are excluded from analysis. Their correctness is checked in CI instead:
# B4 fails when schema.prisma and the migrations disagree.
#
# The database role scripts (ADR-DAT-019) are psql scripts (\getenv, \if, \gexec)
# with the same PL/SQL misreading; the psql variable :'owner_pw' even looks like a
# hard-coded password. They are exercised in CI instead: B4 runs both on every PR
# and p18-1-roles-base-de-datos checks the resulting privileges.
sonar.exclusions=apps/api/prisma/migrations/**,apps/api/prisma/migrations-archive/**,apps/api/prisma/db-roles/*.sql
