# SonarCloud Automatic Analysis configuration.
#
# Test files are excluded from copy-paste detection only: they are still
# analysed for bugs, vulnerabilities and security hotspots. Integration suites
# repeat setup on purpose (each one boots its own compiled API and fixtures),
# so their duplication is not product debt. Owner decision, 2026-11-09.
sonar.cpd.exclusions=**/*.spec.ts,**/*.integration-spec.ts,**/*.e2e-spec.ts,**/test/**
