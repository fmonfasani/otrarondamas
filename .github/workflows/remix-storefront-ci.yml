name: Remix Storefront CI

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/wapsell-remix/**"
      - ".github/workflows/remix-storefront-ci.yml"

permissions:
  contents: read

concurrency:
  group: remix-storefront-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  remix:
    name: Remix quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/wapsell-remix
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/wapsell-remix/package.json

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build Remix
        run: npm run build
