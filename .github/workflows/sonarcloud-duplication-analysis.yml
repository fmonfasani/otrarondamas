name: SonarCloud Duplication Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  sonarcloud-analysis:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for SonarCloud analysis

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'

      - name: Install dependencies
        run: npm ci

      - name: Run SonarCloud scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONARCLOUD_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=fmonfasani_otrarondamas
            -Dsonar.organization=fmonfasani
            -Dsonar.sources=apps,packages
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/*.spec.ts,**/*.test.ts
            -Dsonar.tests=apps,packages
            -Dsonar.test.inclusions=**/*.spec.ts,**/*.test.ts

      - name: Comment PR with duplication report
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fetch = require('node-fetch');
            const token = process.env.SONAR_TOKEN;
            const auth = Buffer.from(`${token}:`).toString('base64');
            const pr = context.payload.pull_request.number;
            const project = 'fmonfasani_otrarondamas';

            try {
              // Get measures
              const measuresRes = await fetch(
                `https://sonarcloud.io/api/measures/component_tree?component=${project}&pullRequest=${pr}&metricKeys=new_duplicated_lines_density,new_duplicated_lines,new_lines&qualifiers=FIL&ps=500`,
                { headers: { 'Authorization': `Basic ${auth}` } }
              );

              if (!measuresRes.ok) {
                console.log('SonarCloud metrics not yet available');
                return;
              }

              const measures = await measuresRes.json();

              if (!measures.components || measures.components.length === 0) {
                console.log('No components with duplications found');
                return;
              }

              let report = '## 📊 SonarCloud Duplication Analysis\n\n';
              report += '| File | Duplication % | New Lines | Duplicated Lines |\n';
              report += '|------|---|---|---|\n';

              let totalDuplication = 0;
              let fileCount = 0;

              for (const component of measures.components) {
                const measures_map = {};
                component.measures?.forEach(m => {
                  measures_map[m.metric] = m.value;
                });

                const dup = parseFloat(measures_map.new_duplicated_lines_density || 0);
                const newLines = measures_map.new_lines || 0;
                const dupLines = measures_map.new_duplicated_lines || 0;

                if (dup > 0) {
                  report += `| ${component.path} | ${dup}% | ${newLines} | ${dupLines} |\n`;
                  totalDuplication += dup;
                  fileCount++;
                }
              }

              report += `\n**Summary**: ${fileCount} files with duplication\n`;
              if (fileCount > 0) {
                report += `Average duplication: ${(totalDuplication / fileCount).toFixed(2)}%\n`;
              }

              github.rest.issues.createComment({
                issue_number: pr,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: report
              });
            } catch (error) {
              console.error('Error analyzing duplication:', error);
              // Don't fail the workflow if SonarCloud is not yet ready
            }
        env:
          SONAR_TOKEN: ${{ secrets.SONARCLOUD_TOKEN }}

      - name: Check SonarCloud quality gate
        if: github.event_name == 'pull_request'
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONARCLOUD_TOKEN }}
