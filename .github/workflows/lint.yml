name: Lint and Type Check (PR)

on:
  # Required status check on main: no path filter, or a PR outside these paths
  # would wait forever for a check that never starts.
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Generate Prisma Client
        run: npm run prisma:generate --workspace=@otrarondamas/api

      - name: Run ESLint
        run: npm run lint --workspace=@otrarondamas/api

      - name: TypeScript type check
        run: ./node_modules/.bin/tsc --noEmit -p tsconfig.build.json
        working-directory: apps/api

      - name: Comment on PR (if lint errors)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Linting or type checking failed. Please review the errors above and fix them.'
            })
