name: ESLint & Prettier

on:
  push:
    branches:
      - 'feat/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        node-version: ['20']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
        continue-on-error: false

      - name: Check code formatting with Prettier
        run: npx prettier --check "{apps,libs,src,test}/**/*.ts"
        continue-on-error: false

      - name: Report linting results
        if: failure()
        run: |
          echo "Linting failed. Please fix the errors above and try again."
          exit 1
