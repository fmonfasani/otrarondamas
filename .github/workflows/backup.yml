name: Daily Database Backup

on:
  schedule:
    # 2 AM UTC every day = 4 AM CET / 10 PM EST previous day
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Notify Slack - Backup Started
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_OPS }}
          payload: |
            {
              "text": "🔄 Database Backup Started",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Database Backup Started* 🔄\n*Environment:* Production\n*Triggered:* Scheduled (02:00 UTC)"
                  }
                }
              ]
            }

      - name: Backup Production Database
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e

            echo "=== Database Backup Started ==="
            BACKUP_TIMESTAMP=$(date +%Y%m%d-%H%M%S)
            BACKUP_DIR="/backups/production"
            BACKUP_FILE="${BACKUP_DIR}/backup-${BACKUP_TIMESTAMP}.sql.gz"

            # Ensure backup directory exists
            mkdir -p "${BACKUP_DIR}"

            # Execute backup
            echo "Creating backup: ${BACKUP_FILE}"
            cd /opt/wapsell

            # Backup with connection parameters
            if docker-compose exec -T postgres pg_dump \
              -U wapsell_user \
              -d wapsell_prod \
              --format=custom \
              --verbose \
              --compression=9 \
              --exclude-schema=pg_* \
              | gzip > "${BACKUP_FILE}"; then
              echo "✅ Backup created successfully"
            else
              echo "❌ Backup failed"
              exit 1
            fi

            # Verify backup file size
            BACKUP_SIZE=$(du -h "${BACKUP_FILE}" | cut -f1)
            echo "Backup size: ${BACKUP_SIZE}"

            if [ ! -s "${BACKUP_FILE}" ]; then
              echo "❌ Backup verification failed - empty file"
              exit 1
            fi

            # Backup metadata
            echo "Backup metadata:"
            ls -lh "${BACKUP_FILE}"
            file "${BACKUP_FILE}"

            # Backup staging database as well
            echo "Creating staging backup..."
            STAGING_BACKUP="${BACKUP_DIR}/backup-staging-${BACKUP_TIMESTAMP}.sql.gz"

            if docker-compose -f /opt/wapsell-staging/docker-compose.yml exec -T postgres pg_dump \
              -U wapsell_user \
              -d wapsell_staging \
              --format=custom \
              --compression=9 \
              | gzip > "${STAGING_BACKUP}"; then
              echo "✅ Staging backup created successfully"
            else
              echo "⚠️ Staging backup failed (non-critical)"
            fi

            # Retention policy: keep last 30 days of backups
            echo "Applying retention policy (keep last 30 days)..."
            find "${BACKUP_DIR}" -name "backup-*.sql.gz" -mtime +30 -type f -delete

            echo "✅ Retention policy applied"

            # List recent backups
            echo "Recent backups:"
            ls -lh "${BACKUP_DIR}" | tail -5

            # Calculate total backup size
            TOTAL_SIZE=$(du -sh "${BACKUP_DIR}" | cut -f1)
            echo "Total backup size: ${TOTAL_SIZE}"

            echo "✅ Database backup completed successfully"

      - name: Backup PostgreSQL Configuration
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e

            echo "=== PostgreSQL Configuration Backup ==="
            BACKUP_DIR="/backups/production/configs"
            BACKUP_TIMESTAMP=$(date +%Y%m%d-%H%M%S)

            mkdir -p "${BACKUP_DIR}"

            # Backup postgres.conf and pg_hba.conf
            cd /opt/wapsell
            docker-compose exec -T postgres pg_dump \
              -U wapsell_user \
              -d wapsell_prod \
              --schema-only \
              | gzip > "${BACKUP_DIR}/schema-${BACKUP_TIMESTAMP}.sql.gz"

            echo "✅ PostgreSQL configuration backed up"

      - name: Verify Backup Integrity
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e

            echo "=== Verifying Backup Integrity ==="
            BACKUP_DIR="/backups/production"
            LATEST_BACKUP=$(ls -t "${BACKUP_DIR}"/backup-[0-9]*.sql.gz 2>/dev/null | head -1)

            if [ -z "${LATEST_BACKUP}" ]; then
              echo "❌ No backup files found"
              exit 1
            fi

            echo "Verifying: ${LATEST_BACKUP}"

            # Check if file is valid gzip
            if gzip -t "${LATEST_BACKUP}"; then
              echo "✅ Backup file integrity verified (valid gzip)"
            else
              echo "❌ Backup file is corrupted"
              exit 1
            fi

            # Try to list tables (non-destructive test)
            if gunzip -c "${LATEST_BACKUP}" | pg_restore -l 2>/dev/null | head -20; then
              echo "✅ Backup contains valid PostgreSQL data"
            else
              echo "⚠️ Could not verify PostgreSQL data (may be expected)"
            fi

      - name: Notify Slack - Backup Success
        if: success()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_OPS }}
          payload: |
            {
              "text": "✅ Database Backup Completed Successfully",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Database Backup Completed Successfully* ✅\n*Environment:* Production\n*Status:* All backups verified\n*Retention:* Last 30 days retained"
                  }
                }
              ]
            }

      - name: Notify Slack - Backup Failure
        if: failure()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_OPS }}
          payload: |
            {
              "text": "❌ Database Backup Failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Database Backup Failed* ❌\n*Environment:* Production\n*Status:* Action required\n*Logs:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Logs>"
                  }
                }
              ]
            }
