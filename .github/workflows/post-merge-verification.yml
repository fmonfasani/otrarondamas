name: Post-Merge Verification

on:
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  post-merge-verification:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: otrarondamas
        ports:
          - 5500:5432
        options: >-
          --health-cmd "pg_isready -U user -d otrarondamas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://user:password@localhost:5500/otrarondamas?schema=public
      JWT_SECRET: s-v1-ci-only-jwt-secret
      GOOGLE_CLIENT_ID: s-v1-ci-only-client-id
      GOOGLE_CLIENT_SECRET: s-v1-ci-only-client-secret
      GOOGLE_CALLBACK_URL: http://127.0.0.1:3399/auth/google/callback

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - run: npm ci --ignore-scripts
      - run: npm run prisma:generate --workspace=@otrarondamas/api
      - run: npm run build --workspace=@otrarondamas/api
      - run: npx prisma db push --schema apps/api/prisma/schema.prisma --skip-generate
      - run: npm test --workspace=@otrarondamas/api -- --maxWorkers=50%

      - name: Run full integration regression suite
        shell: bash
        run: |
          cd apps/api

          mapfile -t test_files < <(
            find test/integration -maxdepth 1 -type f \( -name 's-v1-*.integration-spec.ts' -o -name 'fs-1a-*.integration-spec.ts' -o -name 'p*.integration-spec.ts' -o -name 'c5b-*.integration-spec.ts' -o -name 'f*.integration-spec.ts' -o -name 'tenant-isolation.integration-spec.ts' -o -name '*-participation.integration-spec.ts' -o -name 'store-*.integration-spec.ts' \) | sort
          )

          if [ "${#test_files[@]}" -eq 0 ]; then
            echo "No integration tests found."
            exit 1
          fi

          printf 'Running %d integration test files (post-merge full regression):\n' "${#test_files[@]}"
          printf '  %s\n' "${test_files[@]}"

          npm run test:integration -- --maxWorkers=50% "${test_files[@]}"
