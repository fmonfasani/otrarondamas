name: B4 Verification Infrastructure

on:
  push:
    branches: [main, "b4/**"]
  pull_request:
    branches: [main]

# Avoid spending runner minutes validating obsolete commits when a newer
# commit for the same PR/branch has already arrived.
concurrency:
  group: b4-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: otrarondamas
        ports:
          - 5500:5432
        options: >-
          --health-cmd "pg_isready -U user -d otrarondamas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://user:password@localhost:5500/otrarondamas?schema=public
      JWT_SECRET: s-v1-ci-only-jwt-secret
      GOOGLE_CLIENT_ID: s-v1-ci-only-client-id
      GOOGLE_CLIENT_SECRET: s-v1-ci-only-client-secret
      GOOGLE_CALLBACK_URL: http://127.0.0.1:3399/auth/google/callback

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Run Engineering Kit smoke tests
        run: node --test tools/engineering/test/*.test.js

      - name: Install dependencies
        run: npm ci --ignore-scripts --workspace=@otrarondamas/api --include-workspace-root

      - name: Generate Prisma Client
        run: npm run prisma:generate --workspace=@otrarondamas/api

      - name: Build API
        run: npm run build --workspace=@otrarondamas/api

      - name: Prepare PostgreSQL schema
        run: ./node_modules/.bin/prisma db push --schema apps/api/prisma/schema.prisma --skip-generate

      # CI-specific Jest scripts intentionally do not regenerate Prisma Client:
      # the client was generated once above, before build and both test stages.
      - name: Run API unit tests
        run: |
          mkdir -p apps/api/test-results
          npm run test:ci --workspace=@otrarondamas/api -- --runInBand --json --outputFile=test-results/unit.json

      # Every integration suite runs here except the explicit quarantine below,
      # so a new suite is gated by default. One Jest process (--runInBand)
      # avoids repeated ts-jest startup and shared-DB races.
      #
      # QUARANTINE: suites still red on main, each waiting on an owner decision.
      # Remove an entry only together with the change that makes it green;
      # never add one to get a PR through.
      #   c5b-cart-api              POST cart response has no CartItem
      - name: Run API integration verification suites
        shell: bash
        run: |
          cd apps/api

          quarantine=(
            test/integration/c5b-cart-api.integration-spec.ts
          )

          for required in tenant-isolation b3-tenant-isolation; do
            if [ ! -f "test/integration/${required}.integration-spec.ts" ]; then
              echo "Required ${required} regression test is missing."
              exit 1
            fi
          done

          mapfile -t test_files < <(
            find test/integration -maxdepth 1 -type f -name '*.integration-spec.ts' -print \
              | sort \
              | grep -vxF -f <(printf '%s\n' "${quarantine[@]}")
          )

          if [ "${#test_files[@]}" -eq 0 ]; then
            echo "No integration tests found."
            exit 1
          fi

          printf 'Running %d API integration test files in one Jest process (%d quarantined):\n' \
            "${#test_files[@]}" "${#quarantine[@]}"
          printf '  %s\n' "${test_files[@]}"
          npm run test:integration:ci -- --runInBand --json --outputFile=test-results/integration.json "${test_files[@]}"

      # Preserve machine-readable Jest output even when a suite fails.
      - name: Upload B4 test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b4-test-reports
          path: apps/api/test-results/*.json
          if-no-files-found: ignore
          retention-days: 7
