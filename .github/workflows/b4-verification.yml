name: B4 Verification Infrastructure

on:
  push:
    branches: [main, "b4/**"]
  pull_request:
    branches: [main]

# Avoid spending runner minutes validating obsolete commits when a newer
# commit for the same PR/branch has already arrived.
concurrency:
  group: b4-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api-verification:
    # Authorization cut-over (OR-B4-026, step 2): the whole suite runs with the legacy
    # guards deciding (shadow, the required "api-verification" check) and with the
    # canonical role matrix deciding (enforce). The shadow job keeps the exact name the
    # branch protection requires.
    name: ${{ matrix.authz_mode == 'shadow' && 'api-verification' || format('api-verification ({0})', matrix.authz_mode) }}
    strategy:
      fail-fast: false
      matrix:
        authz_mode: [shadow, enforce]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: otrarondamas
        ports:
          - 5500:5432
        options: >-
          --health-cmd "pg_isready -U user -d otrarondamas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # DATABASE_URL, SYSTEM_DATABASE_URL and OWNER_DATABASE_URL come from the
      # "Database roles" step (ADR-DAT-019).
      JWT_SECRET: s-v1-ci-only-jwt-secret
      GOOGLE_CLIENT_ID: s-v1-ci-only-client-id
      GOOGLE_CLIENT_SECRET: s-v1-ci-only-client-secret
      GOOGLE_CALLBACK_URL: http://127.0.0.1:3399/auth/google/callback
      AUTHZ_ENGINE_MODE: ${{ matrix.authz_mode }}

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Run Engineering Kit smoke tests
        run: node --test tools/engineering/test/*.test.js

      - name: Install dependencies
        run: npm ci --ignore-scripts --workspace=@otrarondamas/api --include-workspace-root

      - name: Generate Prisma Client
        run: npm run prisma:generate --workspace=@otrarondamas/api

      - name: Build API
        run: npm run build --workspace=@otrarondamas/api

      # ADR-DAT-019: the same database roles as production. Passwords are random
      # per run (this database lives only for this job) and masked in the logs.
      # The API and every suite use wapsell_app (DATABASE_URL) and wapsell_system
      # (SYSTEM_DATABASE_URL); only migrations use the owner (OWNER_DATABASE_URL).
      - name: Database roles (ADR-DAT-019)
        env:
          PGPASSWORD: password
        run: |
          db="localhost:5500/otrarondamas?schema=public"
          for role in owner app system; do
            pw="$(openssl rand -hex 16)"
            echo "::add-mask::$pw"
            export "WAPSELL_${role^^}_PW=$pw"
          done
          {
            echo "DATABASE_URL=postgresql://wapsell_app:${WAPSELL_APP_PW}@${db}"
            echo "SYSTEM_DATABASE_URL=postgresql://wapsell_system:${WAPSELL_SYSTEM_PW}@${db}"
            echo "OWNER_DATABASE_URL=postgresql://wapsell_owner:${WAPSELL_OWNER_PW}@${db}"
          } >> "$GITHUB_ENV"
          psql -h localhost -p 5500 -U user -d otrarondamas -v ON_ERROR_STOP=1 -f apps/api/prisma/db-roles/roles.sql

      # ADR-DAT-016: the schema must be fully described by versioned migrations.
      # Fails when schema.prisma changed without a migration (or the reverse).
      - name: Migrations match schema.prisma
        run: >-
          ./node_modules/.bin/prisma migrate diff
          --from-migrations apps/api/prisma/migrations
          --to-schema-datamodel apps/api/prisma/schema.prisma
          --shadow-database-url postgresql://user:password@localhost:5500/postgres
          --exit-code

      - name: Prepare PostgreSQL schema (migrate deploy as the owner, then privileges)
        run: |
          export DATABASE_URL="$OWNER_DATABASE_URL"
          ./node_modules/.bin/prisma migrate deploy --schema apps/api/prisma/schema.prisma
          ./node_modules/.bin/prisma db execute --schema apps/api/prisma/schema.prisma --file apps/api/prisma/db-roles/grants.sql

      # CI-specific Jest scripts intentionally do not regenerate Prisma Client:
      # the client was generated once above, before build and both test stages.
      - name: Run API unit tests
        run: |
          mkdir -p apps/api/test-results
          npm run test:ci --workspace=@otrarondamas/api -- --runInBand --json --outputFile=test-results/unit.json

      # Every integration suite runs here except the explicit quarantine below,
      # so a new suite is gated by default. One Jest process (--runInBand)
      # avoids repeated ts-jest startup and shared-DB races.
      #
      # QUARANTINE: suites still red on main, each waiting on an owner decision.
      # Remove an entry only together with the change that makes it green;
      # never add one to get a PR through.
      #   (empty since 2026-11-10: every integration suite is gated)
      - name: Run API integration verification suites
        shell: bash
        run: |
          cd apps/api

          quarantine=(
          )

          for required in tenant-isolation b3-tenant-isolation; do
            if [ ! -f "test/integration/${required}.integration-spec.ts" ]; then
              echo "Required ${required} regression test is missing."
              exit 1
            fi
          done

          mapfile -t test_files < <(
            find test/integration -maxdepth 1 -type f -name '*.integration-spec.ts' -print \
              | sort \
              | grep -vxF -f <(printf '%s\n' "${quarantine[@]}")
          )

          if [ "${#test_files[@]}" -eq 0 ]; then
            echo "No integration tests found."
            exit 1
          fi

          printf 'Running %d API integration test files in one Jest process (%d quarantined):\n' \
            "${#test_files[@]}" "${#quarantine[@]}"
          printf '  %s\n' "${test_files[@]}"
          npm run test:integration:ci -- --runInBand --json --outputFile=test-results/integration.json "${test_files[@]}"

      # Preserve machine-readable Jest output even when a suite fails.
      - name: Upload B4 test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b4-test-reports-${{ matrix.authz_mode }}
          path: apps/api/test-results/*.json
          if-no-files-found: ignore
          retention-days: 7
