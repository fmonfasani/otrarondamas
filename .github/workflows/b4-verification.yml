name: B4 Verification Infrastructure

on:
  push:
    branches: [main, "b4/**"]
  pull_request:
    branches: [main]

jobs:
  api-verification:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: otrarondamas
        ports:
          - 5500:5432
        options: >-
          --health-cmd "pg_isready -U user -d otrarondamas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://user:password@localhost:5500/otrarondamas?schema=public

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Run Engineering Kit smoke tests
        run: node --test tools/engineering/test/smoke.test.js
      - run: npm ci
      - run: npm run prisma:generate --workspace=@otrarondamas/api
      - run: npm run build --workspace=@otrarondamas/api
      - run: npx prisma db push --schema apps/api/prisma/schema.prisma --skip-generate
      - run: npm test --workspace=@otrarondamas/api -- --runInBand

      # Run the tenant, S-V1, FS-1a and messaging HTTP integration suites in
      # one Jest process. The previous separate invocations repeated Jest and
      # ts-jest startup; discovery remains explicit and fails closed if empty.
      - name: Run API integration verification suites
        env:
          JWT_SECRET: s-v1-ci-only-jwt-secret
          GOOGLE_CLIENT_ID: s-v1-ci-only-client-id
          GOOGLE_CLIENT_SECRET: s-v1-ci-only-client-secret
          GOOGLE_CALLBACK_URL: http://127.0.0.1:3399/auth/google/callback
        shell: bash
        run: |
          cd apps/api

          mapfile -t discovered_test_files < <(
            find test/integration -maxdepth 1 -type f \\( -name 's-v1-*.integration-spec.ts' -o -name 'fs-1a-*.integration-spec.ts' -o -name 'messaging-http*.integration-spec.ts' \\) -print | sort
          )

          if [ "${#discovered_test_files[@]}" -eq 0 ]; then
            echo "No S-V1, FS-1a, or messaging HTTP integration tests found."
            exit 1
          fi
          if [ ! -f test/integration/tenant-isolation.integration-spec.ts ]; then
            echo "Required tenant isolation regression test is missing."
            exit 1
          fi

          mapfile -t test_files < <(
            printf '%s\\n' test/integration/tenant-isolation.integration-spec.ts "${discovered_test_files[@]}" | sort -u
          )

          printf 'Running %d API integration test files in one Jest process:\\n' "${#test_files[@]}"
          printf '  %s\\n' "${test_files[@]}"
          npm run test:integration -- --runInBand "${test_files[@]}"
