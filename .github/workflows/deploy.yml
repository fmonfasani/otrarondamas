name: Deploy to Hetzner

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests (use only in emergencies)'
        required: false
        default: 'false'

concurrency:
  group: deployment
  cancel-in-progress: false

jobs:
  # Stage 1: Code Quality
  quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run ESLint
        run: npm run lint --workspace=@otrarondamas/api

      - name: Generate Prisma Client
        run: npm run prisma:generate --workspace=@otrarondamas/api

      # Production code only (the same tsconfig `nest build` uses). Test files
      # are type-checked by nothing today and carry ~190 known errors; they
      # are tracked separately and must not block the deploy gate.
      - name: TypeScript type check
        run: ../../node_modules/.bin/tsc -p tsconfig.build.json --noEmit
        working-directory: apps/api

  # Stage 2: Build
  build:
    name: Build Application
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Generate Prisma Client
        run: npm run prisma:generate --workspace=@otrarondamas/api

      - name: Build application
        run: npm run build --workspace=@otrarondamas/api

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-build
          path: apps/api/dist/
          retention-days: 1

  # Stage 3: Tests (optional, can be skipped)
  test:
    name: Run Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event.inputs.skip_tests != 'true'
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Generate Prisma Client
        run: npm run prisma:generate --workspace=@otrarondamas/api

      - name: Run unit tests
        run: npm run test --workspace=@otrarondamas/api
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            apps/api/coverage/
            apps/api/test-results.json
          retention-days: 7

  # Stage 4: Security Scan (optional)
  security:
    name: Security Scan
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

  # Stage 5: Deploy to Hetzner
  deploy:
    name: Deploy to Hetzner VPS
    needs: [quality, build, test, security]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # Required reviewers on this environment make every production deploy a manual approval.
    environment:
      name: production
      url: https://wapsell.com
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
      SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Secrets reach the shell through env, never expanded into the script.
      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s
' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      # Production runs on Docker Compose (/opt/wapsell). The script rebuilds
      # the API image for this commit, syncs the schema without data loss,
      # boot-tests the image in isolation and only then swaps the container,
      # rolling back automatically if it does not become healthy.
      - name: Deploy API image
        env:
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
          SSH_USER: ${{ secrets.HETZNER_USER }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST"             "bash -s -- $DEPLOY_SHA" < scripts/deploy-docker.sh

      - name: Slack notification (success)
        if: success() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "✅ Deployment successful",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Deployment Successful* ✅\n*Repository:* ${{ github.repository }}\n*Branch:* main\n*Commit:* ${{ github.sha }}\n*Author:* ${{ github.actor }}"
                  }
                }
              ]
            }

      - name: Slack notification (failure)
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "❌ Deployment failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Deployment Failed* ❌\n*Repository:* ${{ github.repository }}\n*Branch:* main\n*Commit:* ${{ github.sha }}\n*Author:* ${{ github.actor }}\n*Action:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View details>"
                  }
                }
              ]
            }
