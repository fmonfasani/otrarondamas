name: CI/CD Pipeline - Optimized

on:
  push:
    branches: [main, refactor/opcion-6]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io

jobs:
  setup:
    runs-on: ubuntu-latest
    name: Setup and Cache
    outputs:
      cache-hit: ${{ steps.cache.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - id: cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Clean install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          npm cache clean --force
          npm ci --prefer-offline --no-audit

  lint:
    runs-on: ubuntu-latest
    name: Lint and Type Check
    needs: setup
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - name: Type check
        run: npx tsc --noEmit
        working-directory: apps/api

      - name: Lint code
        run: npm run lint

  unit-tests:
    runs-on: ubuntu-latest
    name: Unit Tests
    needs: setup
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - name: Run unit tests
        run: npm test -- --run

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        if: always()
        with:
          files: ./coverage/coverage-final.json

  build:
    runs-on: ubuntu-latest
    name: Build
    needs: [lint, unit-tests]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: apps/api/dist
          retention-days: 1

  e2e-tests:
    runs-on: ubuntu-latest
    name: E2E Tests
    needs: build
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wapsell_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build
          path: apps/api/dist

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wapsell_test
          NODE_ENV: test

  security:
    runs-on: ubuntu-latest
    name: Security Scan
    needs: setup
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - name: Run npm audit
        run: npm audit --production || true

      - name: Check for secrets
        uses: gitleaks/gitleaks-action@v2
        if: always()

  verify:
    runs-on: ubuntu-latest
    name: Pipeline Verification
    needs: [lint, unit-tests, build, e2e-tests, security]
    if: always()
    steps:
      - name: Check status
        run: |
          if [ "${{ needs.lint.result }}" = "failure" ] || \
             [ "${{ needs.unit-tests.result }}" = "failure" ] || \
             [ "${{ needs.build.result }}" = "failure" ] || \
             [ "${{ needs.e2e-tests.result }}" = "failure" ]; then
            echo "Pipeline failed"
            exit 1
          fi
          echo "Pipeline succeeded"
          exit 0

  deploy:
    runs-on: ubuntu-latest
    name: Deploy to VPS
    needs: [build, e2e-tests, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && success()
    timeout-minutes: 15
    environment:
      name: production
      url: https://wapsell.com

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build
          path: apps/api/dist

      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        if: ${{ secrets.VPS_HOST != '' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            cd /opt/wapsell
            git pull origin main
            npm ci --prefer-offline
            npm run build
            pm2 restart wapsell-api || pm2 start npm --name wapsell-api -- run start:prod
            pm2 save

      - name: Verify deployment
        run: |
          RETRIES=5
          while [ $RETRIES -gt 0 ]; do
            HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' https://wapsell.com)
            if [ $HTTP_CODE -eq 200 ]; then
              echo "Deployment successful"
              exit 0
            fi
            RETRIES=$((RETRIES - 1))
            sleep 10
          done
          echo "Deployment verification failed"
          exit 1
        if: ${{ secrets.VPS_HOST != '' }}

      - name: Notify success
        uses: slackapi/slack-github-action@v1.24.0
        if: success()
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "Wapsell deployment successful",
              "blocks": [{
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Wapsell Deployment* - SUCCESS\nBranch: ${{ github.ref }}\nCommit: ${{ github.sha }}\nAuthor: ${{ github.actor }}"
                }
              }]
            }

      - name: Notify failure
        uses: slackapi/slack-github-action@v1.24.0
        if: failure()
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "Wapsell deployment failed",
              "blocks": [{
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Wapsell Deployment* - FAILED\nBranch: ${{ github.ref }}\nCommit: ${{ github.sha }}\nAuthor: ${{ github.actor }}"
                }
              }]
            }
