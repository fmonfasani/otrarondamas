name: B3 Tenant Isolation Candidate

on:
  push:
    branches: [main, "b3/**", "chore/**"]
    paths:
      - "apps/api/src/**"
      - "apps/api/test/integration/b3-tenant-isolation.integration-spec.ts"
      - "apps/api/test/integration/b3-producto-familia.integration-spec.ts"
      - "apps/api/test/integration/b3-producto-proveedor.integration-spec.ts"
      - "apps/api/test/integration/b3-iso-006.integration-spec.ts"
      - "apps/api/test/integration/b3-provider-payment-return-characterization.integration-spec.ts"
      - "apps/api/prisma/**"
      - "apps/api/package.json"
      - "package-lock.json"
      - ".github/workflows/b3-tenant-isolation-candidate.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/api/src/**"
      - "apps/api/test/integration/b3-tenant-isolation.integration-spec.ts"
      - "apps/api/test/integration/b3-producto-familia.integration-spec.ts"
      - "apps/api/test/integration/b3-producto-proveedor.integration-spec.ts"
      - "apps/api/prisma/**"
      - "apps/api/package.json"
      - "package-lock.json"
      - ".github/workflows/b3-tenant-isolation-candidate.yml"

jobs:
  b3-tenant-isolation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: otrarondamas
        ports:
          - 5500:5432
        options: >-
          --health-cmd "pg_isready -U user -d otrarondamas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://user:password@localhost:5500/otrarondamas?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run prisma:generate --workspace=@otrarondamas/api

      - run: npx prisma db push --schema apps/api/prisma/schema.prisma --skip-generate

      - run: npm test --workspace=@otrarondamas/api -- --runInBand

      - name: Run B3 tenant isolation candidate
        run: >-
          npm run test:integration --workspace=@otrarondamas/api --
          --runInBand
          test/integration/b3-tenant-isolation.integration-spec.ts

      - name: Run Producto-Familia candidate
        run: >-
          npm run test:integration --workspace=@otrarondamas/api --
          --runInBand
          test/integration/b3-producto-familia.integration-spec.ts

      - name: Run Producto-Proveedor candidate
        run: >-
          npm run test:integration --workspace=@otrarondamas/api --
          --runInBand
          test/integration/b3-producto-proveedor.integration-spec.ts

      - name: Run ISO-006 candidate
        run: >-
          npm run test:integration --workspace=@otrarondamas/api --
          --runInBand
          test/integration/b3-iso-006.integration-spec.ts

      - name: Run provider payment-return characterization
        run: >-
          npm run test:integration --workspace=@otrarondamas/api --
          --runInBand
          test/integration/b3-provider-payment-return-characterization.integration-spec.ts

      - name: Run DevolucionProveedorItem regression
        run: >-
          npm run test:integration --workspace=@otrarondamas/api --
          --runInBand
          test/integration/b3-devolucion-proveedor-item.integration-spec.ts
