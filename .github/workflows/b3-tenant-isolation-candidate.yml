name: B3 Tenant Isolation Candidate

on:
  # The push and pull_request path lists MUST stay identical. When they
  # diverge, a change can trigger the workflow on push but skip it on the
  # pull request (or the reverse) — and a skipped workflow is visually
  # indistinguishable from a passing one, so the candidate suites can
  # silently disappear from a PR. `apps/api/test/integration/**` covers
  # every current and future integration spec, so adding a suite cannot
  # leave it unmatched here.
  push:
    branches: [main, "b3/**", "chore/**"]
    paths:
      - "apps/api/src/**"
      - "apps/api/test/integration/**"
      - "apps/api/prisma/**"
      - "apps/api/package.json"
      - "apps/api/tsconfig.json"
      - "apps/api/tsconfig.build.json"
      - "package-lock.json"
      - ".github/workflows/b4-verification.yml"
      - ".github/workflows/b3-tenant-isolation-candidate.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/api/src/**"
      - "apps/api/test/integration/**"
      - "apps/api/prisma/**"
      - "apps/api/package.json"
      - "apps/api/tsconfig.json"
      - "apps/api/tsconfig.build.json"
      - "package-lock.json"
      - ".github/workflows/b4-verification.yml"
      - ".github/workflows/b3-tenant-isolation-candidate.yml"

jobs:
  b3-tenant-isolation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: otrarondamas
        ports:
          - 5500:5432
        options: >-
          --health-cmd "pg_isready -U user -d otrarondamas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://user:password@localhost:5500/otrarondamas?schema=public

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run prisma:generate --workspace=@otrarondamas/api

      # B4 owns the build and complete unit suite for pull requests and main.
      # Keep those checks here only for direct pushes to candidate/chore branches,
      # where B4 is not guaranteed to run. This removes duplicate work on PRs
      # without weakening the pre-merge gate.
      - name: Build API on candidate branch pushes
        if: github.event_name == 'push'
        run: npm run build --workspace=@otrarondamas/api

      - run: npx prisma db push --schema apps/api/prisma/schema.prisma --skip-generate

      - name: Run unit suite on candidate branch pushes
        if: github.event_name == 'push'
        run: npm test --workspace=@otrarondamas/api -- --runInBand

      # One Jest process for all candidate specs avoids repeating Jest startup
      # and ts-jest initialization for each file. The full file list remains explicit.
      - name: Run B3 tenant and relation candidates
        run: >-
          npm run test:integration --workspace=@otrarondamas/api --
          --runInBand
          test/integration/b3-tenant-isolation.integration-spec.ts
          test/integration/b3-producto-familia.integration-spec.ts
          test/integration/b3-producto-proveedor.integration-spec.ts
          test/integration/b3-lote-producto.integration-spec.ts
          test/integration/b3-producto-subfamilia.integration-spec.ts
          test/integration/b3-producto-tipo.integration-spec.ts
          test/integration/b3-producto-subtipo.integration-spec.ts
          test/integration/b3-iso-006.integration-spec.ts
          test/integration/b3-provider-payment-return-characterization.integration-spec.ts
          test/integration/b3-devolucion-proveedor-item.integration-spec.ts
          test/integration/b3-movimientostock-producto.integration-spec.ts
          test/integration/b3-reglafidelizacion-subtipo.integration-spec.ts
          test/integration/b3-reglafidelizacion-familia.integration-spec.ts
          test/integration/b3-reglafidelizacion-subfamilia.integration-spec.ts
