name: B3 Tenant Isolation Candidate

on:
  # The push and pull_request path lists MUST stay identical. When they
  # diverge, a change can trigger the workflow on push but skip it on the
  # pull request (or the reverse) — and a skipped workflow is visually
  # indistinguishable from a passing one, so the candidate suites can
  # silently disappear from a PR. `apps/api/test/integration/**` covers
  # every current and future integration spec, so adding a suite cannot
  # leave it unmatched here.
  push:
    branches: [main, "b3/**", "chore/**"]
    paths:
      - "apps/api/src/**"
      - "apps/api/test/integration/**"
      - "apps/api/prisma/**"
      - "apps/api/package.json"
      - "apps/api/tsconfig.json"
      - "apps/api/tsconfig.build.json"
      - "package-lock.json"
      - ".github/workflows/b3-tenant-isolation-candidate.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/api/src/**"
      - "apps/api/test/integration/**"
      - "apps/api/prisma/**"
      - "apps/api/package.json"
      - "apps/api/tsconfig.json"
      - "apps/api/tsconfig.build.json"
      - "package-lock.json"
      - ".github/workflows/b3-tenant-isolation-candidate.yml"

jobs:
  b3-tenant-isolation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: otrarondamas
        ports:
          - 5500:5432
        options: >-
          --health-cmd "pg_isready -U user -d otrarondamas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://user:password@localhost:5500/otrarondamas?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run prisma:generate --workspace=@otrarondamas/api

      # Build gate: `nest build` compiles src/ via tsconfig.build.json and
      # fails on any TypeScript error. It runs BEFORE db push and the test
      # suites so a compile error fails fast, without spending database
      # time. Non-mutating: output goes to the gitignored dist/ and no
      # source file is rewritten (unlike `npm run lint`, which is
      # `eslint --fix` and is deliberately NOT part of this gate).
      - run: npm run build --workspace=@otrarondamas/api

      - run: npx prisma db push --schema apps/api/prisma/schema.prisma --skip-generate

      - run: npm test --workspace=@otrarondamas/api -- --runInBand

      - name: Run B3 tenant isolation candidate
        run: >-
          npm run test:integration --workspace=@otrarondamas/api --
          --runInBand
          test/integration/b3-tenant-isolation.integration-spec.ts

      - name: Run Producto-Familia candidate
        run: >-
          npm run test:integration --workspace=@otrarondamas/api --
          --runInBand
          test/integration/b3-producto-familia.integration-spec.ts

      - name: Run Producto-Proveedor candidate
        run: >-
          npm run test:integration --workspace=@otrarondamas/api --
          --runInBand
          test/integration/b3-producto-proveedor.integration-spec.ts

      - name: Run Lote-Producto candidate
        run: >-
          npm run test:integration --workspace=@otrarondamas/api --
          --runInBand
          test/integration/b3-lote-producto.integration-spec.ts

      - name: Run ISO-006 candidate
        run: >-
          npm run test:integration --workspace=@otrarondamas/api --
          --runInBand
          test/integration/b3-iso-006.integration-spec.ts

      - name: Run provider payment-return characterization
        run: >-
          npm run test:integration --workspace=@otrarondamas/api --
          --runInBand
          test/integration/b3-provider-payment-return-characterization.integration-spec.ts

      - name: Run DevolucionProveedorItem regression
        run: >-
          npm run test:integration --workspace=@otrarondamas/api --
          --runInBand
          test/integration/b3-devolucion-proveedor-item.integration-spec.ts
