# Nginx dentro del contenedor: sirve el build estático de Vite y reescribe
# a index.html para que las rutas de React Router (ej. /ventas/nueva) no den
# 404 al recargar la página. El TLS/dominio real lo maneja el nginx del host
# (ver /infra/projects/0010-otrarondamas en el VPS), este solo sirve HTTP
# plano en el puerto 80 del contenedor.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
