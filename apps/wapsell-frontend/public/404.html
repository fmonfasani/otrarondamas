<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Página no encontrada</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      .container {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
      }
      .content {
        padding: 20px;
      }
      h1 {
        font-size: 48px;
        font-weight: bold;
        margin-bottom: 16px;
        color: #1a1815;
      }
      p {
        font-size: 18px;
        color: #666;
        margin-bottom: 24px;
      }
      a {
        display: inline-block;
        padding: 10px 24px;
        background-color: #d97757;
        color: white;
        text-decoration: none;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
      }
      a:hover {
        background-color: #c86543;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="content">
        <h1>404</h1>
        <p>Página no encontrada</p>
        <a href="/">Volver al inicio</a>
      </div>
    </div>
  </body>
</html>
