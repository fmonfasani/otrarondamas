version: "3.9"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: wapsell-postgres
    environment:
      POSTGRES_USER: wapsell
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wapsell-dev-password}
      POSTGRES_DB: otrarondamas
      POSTGRES_INITDB_ARGS: "-c max_connections=200"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - wapsell-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wapsell"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # NestJS API
  api:
    build:
      context: .
      dockerfile: ./Dockerfile.api
    container_name: wapsell-api
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://wapsell:${DB_PASSWORD:-wapsell-dev-password}@postgres:5432/otrarondamas
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600}
      API_PORT: 8600
      API_HOST: 0.0.0.0
      CORS_ORIGINS: "http://localhost:3050,http://localhost:3051,http://localhost:3030,http://localhost:3040,http://localhost:3060"
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}
    ports:
      - "8600:8600"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - wapsell-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8600/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # Wapsell Remix (New Frontend)
  wapsell-remix:
    build:
      context: .
      dockerfile: ./Dockerfile.remix
    container_name: wapsell-remix
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      VITE_API_URL: http://localhost:8600
      SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-change-in-production}
      DATABASE_URL: postgresql://wapsell:${DB_PASSWORD:-wapsell-dev-password}@postgres:5432/otrarondamas
    ports:
      - "3051:5173"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - wapsell-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173/"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # POS Admin
  pos-admin:
    build:
      context: .
      dockerfile: ./Dockerfile.pos-admin
    container_name: wapsell-pos-admin
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      REACT_APP_API_URL: http://localhost:8600
      PORT: 3030
    ports:
      - "3030:3030"
    depends_on:
      - api
    networks:
      - wapsell-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3030/"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # Tienda Online
  tienda-online:
    build:
      context: .
      dockerfile: ./Dockerfile.tienda-online
    container_name: wapsell-tienda-online
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      REACT_APP_API_URL: http://localhost:8600
      PORT: 3040
    ports:
      - "3040:3040"
    depends_on:
      - api
    networks:
      - wapsell-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3040/"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

networks:
  wapsell-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local