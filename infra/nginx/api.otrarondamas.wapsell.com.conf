# Reverse-proxies https://api.otrarondamas.wapsell.com -> 127.0.0.1:8600
# donde escucha el contenedor de la API NestJS. Subdominio separado del
# frontend (mismo patrón que api.wapsell.com / app.wapsell.com) para que
# las cookies/tokens del POS no dependan de same-origin con el frontend.

server {
    listen 80;
    listen [::]:80;
    server_name api.otrarondamas.wapsell.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.otrarondamas.wapsell.com;

    # Un solo certificado cubre ambos subdominios (certbot los emitió juntos
    # con -d otrarondamas.wapsell.com -d api.otrarondamas.wapsell.com, y usa
    # el primer nombre como directorio).
    ssl_certificate /etc/letsencrypt/live/otrarondamas.wapsell.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/otrarondamas.wapsell.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:OTRARONDAMAS_API_SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=15768000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 5m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml text/xml application/rss+xml;
    gzip_proxied any;

    location / {
        proxy_pass http://127.0.0.1:8600;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
