# grafana.wapsell.com — the server's dashboards (Grafana on 127.0.0.1:3060, see
# infra/monitoring). Installed on the host as /etc/nginx/sites-available/grafana.wapsell.com and
# enabled with a symlink in sites-enabled. Certificate by certbot (same as app.wapsell.com).
#
# Access: Grafana's own user and password (no sign-up, no anonymous). The login is also braked
# here: a few tries per minute per address.

limit_req_zone $binary_remote_addr zone=grafana_login:10m rate=6r/m;

server {
    listen 80;
    listen [::]:80;
    server_name grafana.wapsell.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name grafana.wapsell.com;

    ssl_certificate /etc/letsencrypt/live/grafana.wapsell.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grafana.wapsell.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:WAPSELL_GRAFANA_SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=15768000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    client_max_body_size 2m;

    location = /login {
        limit_req zone=grafana_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3060;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Grafana Live (dashboards that update by themselves) uses a websocket.
    location /api/live/ {
        proxy_pass http://127.0.0.1:3060;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:3060;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
