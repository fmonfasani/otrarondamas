# app.wapsell.com — Wapsell web app (Remix, container wapsell-web on 127.0.0.1:3050).
# Installed on the host as /etc/nginx/sites-available/app.wapsell.com and enabled
# with a symlink in sites-enabled. Same pattern as api.wapsell.com on this VPS.
# The certificate is managed by certbot (renewal: /etc/letsencrypt/renewal/app.wapsell.com.conf).

server {
    listen 80;
    listen [::]:80;
    server_name app.wapsell.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.wapsell.com;

    ssl_certificate /etc/letsencrypt/live/app.wapsell.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.wapsell.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:WAPSELL_APP_SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=15768000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    client_max_body_size 10m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml text/xml image/svg+xml;
    gzip_proxied any;

    # Fingerprinted Remix assets: cache for a year. (A location-level add_header drops
    # the server-level ones, so the security headers are repeated here.)
    location /build/ {
        proxy_pass http://127.0.0.1:3050;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=15768000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}
