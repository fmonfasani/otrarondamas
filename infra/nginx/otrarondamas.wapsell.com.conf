# Reverse-proxies https://otrarondamas.wapsell.com -> 127.0.0.1:3040 donde
# escucha el contenedor tienda-online (nginx sirviendo el build de Vite).
# Sigue el mismo patrón que app.wapsell.com / api.wapsell.com en este VPS.
#
# Corte de dominios (RF-06, 22/09/2026): este dominio raíz pasó de
# servir pos-admin a servir la tienda pública. pos-admin se mudó a
# admin.otrarondamas.wapsell.com (ver ese .conf) — el certificado
# actual (otrarondamas.wapsell.com + api.otrarondamas.wapsell.com) no
# necesita reemitirse para este cambio, solo cambia el puerto del
# proxy_pass.

server {
    listen 80;
    listen [::]:80;
    server_name otrarondamas.wapsell.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name otrarondamas.wapsell.com;

    ssl_certificate /etc/letsencrypt/live/otrarondamas.wapsell.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/otrarondamas.wapsell.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:OTRARONDAMAS_APP_SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=15768000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 5m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml text/xml application/rss+xml image/svg+xml;
    gzip_proxied any;

    location /assets/ {
        proxy_pass http://127.0.0.1:3040;
        proxy_set_header Host $host;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3040;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}
