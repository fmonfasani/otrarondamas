# Reverse-proxies https://admin.otrarondamas.wapsell.com -> 127.0.0.1:3030
# donde escucha el contenedor pos-admin (nginx sirviendo el build de Vite).
#
# Corte de dominios (RF-06): pos-admin se muda de la raíz de
# otrarondamas.wapsell.com (que ahora sirve la tienda pública, ver
# otrarondamas.wapsell.com.conf) a este subdominio. Mismo contenido que
# tenía ese vhost antes del corte, solo cambia server_name y el
# certificado.
#
# ACTIVACIÓN: este archivo requiere que admin.otrarondamas.wapsell.com
# ya resuelva por DNS antes de emitir el certificado (ver
# docs/scaffolding-notas.md, sección del corte de dominios). Hasta
# entonces, NO copiar a /etc/nginx/sites-enabled/ ni correr certbot con
# este dominio — certbot falla el challenge HTTP-01 si el DNS no
# resuelve todavía.
#
# Pasos de activación en el VPS (una vez que el DNS resuelva):
#   1. certbot certonly --webroot -w /var/www/certbot \
#        -d admin.otrarondamas.wapsell.com
#   2. cp este archivo a /etc/nginx/sites-enabled/
#   3. nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name admin.otrarondamas.wapsell.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.otrarondamas.wapsell.com;

    ssl_certificate /etc/letsencrypt/live/admin.otrarondamas.wapsell.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.otrarondamas.wapsell.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:OTRARONDAMAS_ADMIN_SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=15768000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 5m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml text/xml application/rss+xml image/svg+xml;
    gzip_proxied any;

    location /assets/ {
        proxy_pass http://127.0.0.1:3030;
        proxy_set_header Host $host;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}
