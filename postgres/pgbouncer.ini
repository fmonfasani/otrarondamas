;
; PgBouncer Configuration for Wapsell
; Connection pooling proxy for PostgreSQL
; Deployment: optional, enable for high-concurrency environments
;
; Usage: pgbouncer -d pgbouncer.ini
; Or: docker run -d -v $(pwd)/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini pgbouncer:latest

[databases]
; Map logical database names to PostgreSQL connection strings
wapsell_prod = host=postgres port=5432 dbname=wapsell_prod user=wapsell_prod password=POSTGRES_PASSWORD

[pgbouncer]
; Listening address and port
listen_addr = 0.0.0.0
listen_port = 6432

; Administrator socket (local only)
admin_users = postgres
stats_users = stats
;user = pgbouncer

; === POOL MODE SELECTION ===
; transaction: one connection per transaction (default, safest)
; session: one connection per session (persistent)
; statement: one connection per statement (fastest, requires care)
pool_mode = transaction

; === CONNECTION LIMITS ===
; Maximum connections to PostgreSQL
max_db_connections = 100

; Maximum connections per user
max_user_connections = 50

; Connection pool size per (database, user) pair
; Recommended: (number_of_app_servers * connections_per_app) / number_of_databases
default_pool_size = 25

; Minimum pool size (connections kept open)
min_pool_size = 5

; How many extra connections to open for one (database, user) pair
reserve_pool_size = 5

; Time to wait for a connections to be available (seconds)
reserve_pool_timeout = 3

; Connections will be dropped after this time (seconds)
; Set to 0 to disable
idle_in_transaction_session_timeout = 0

; How long to keep connections open if unused (seconds)
server_idle_timeout = 600

; How long to wait for server to respond (seconds)
server_connect_timeout = 15

; How long to wait for server to respond to a query (seconds)
server_lifetime = 3600

; How long to wait for server to respond to a disconnect (seconds)
server_close_timeout = 15

; === CLIENT CONNECTION LIMITS ===
; How long to wait for client to respond (seconds)
client_idle_timeout = 3600

; How long to wait for server to accept a new connection (seconds)
client_login_timeout = 60

; === AUTHENTICATION ===
; Use .pgpass format for passwords (optional)
; auth_file = /etc/pgbouncer/.pgpass
; auth_user = pgbouncer
; auth_type = plain  # md5, plain, scram-sha-256, cert

; === PROTOCOL ===
; Backend network protocol version (3 for PostgreSQL 7.4+)
pkt_buf = 4096

; === PERFORMANCE ===
; SQL parsing (none, auto, or full)
query_wait_timeout = 120
query_max_retry = 0

; Disable nagle algorithm (reduce latency)
tcp_defer_accept = 0
tcp_keepalives_idle = 0
tcp_keepalives_interval = 0
tcp_keepalives_count = 0

; === LOGGING ===
; Log level (debug, info, notice, warning, error, log)
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
log_stats = 1

; Log file (if empty, log to syslog)
logfile = /var/log/pgbouncer/pgbouncer.log

; Verbosity of logging (0-2)
verbose = 1

; Statistics collection interval (seconds)
stats_period = 60

; === MAINTENANCE ===
; Pause pgbouncer operation to drain connections
; pause_mode = pause

; === NETWORKING ===
; Unix socket location
unix_socket_dir = /var/run/pgbouncer
unix_socket_mode = 0777
unix_socket_group =

; === SERVER HEALTH CHECK ===
; Query to run to detect server availability
server_check_query = SELECT 1

; How often to check server health (seconds, 0 = disabled)
server_check_delay = 30

; === SSL/TLS ===
; server_tls_sslmode = disable
; server_tls_certfile =
; server_tls_keyfile =
; server_tls_ca_file =

; === MISC ===
; Disallow direct server connections (security)
disable_pqexec = 0

; Session pool mode defaults
application_name_add_host = 0

; Whether to run PgBouncer in daemon mode
daemonize = 0

; PID file (if running as daemon)
pidfile = /var/run/pgbouncer/pgbouncer.pid
