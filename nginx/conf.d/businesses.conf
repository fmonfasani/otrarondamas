# Wapsell Businesses routing: /businesses/{handle}/api/*

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name api.wapsell.com otrarondamas.wapsell.com admin.otrarondamas.wapsell.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS API server
server {
    listen 443 ssl http2;
    server_name api.wapsell.com;

    ssl_certificate /etc/letsencrypt/live/api.wapsell.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.wapsell.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Businesses endpoint with handle-based routing
    location ~ ^/businesses/(?<handle>[a-z0-9-]+)/api/(?<path>.*) {
        proxy_pass http://api_backend/$path;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Business-Handle $handle;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    # Health check endpoint
    location /api/health {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger docs
    location /api/docs {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
    }

    # Root redirect
    location / {
        return 301 /api/health;
    }
}

# HTTPS Main domain (tienda-online)
server {
    listen 443 ssl http2;
    server_name otrarondamas.wapsell.com www.otrarondamas.wapsell.com;

    ssl_certificate /etc/letsencrypt/live/otrarondamas.wapsell.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/otrarondamas.wapsell.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://tienda-online:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

