# nginx configuration for Wapsell frontends
# Used by both tienda-online and pos-admin (reverse proxy)
#
# Health check: GET /health -> 200 OK
# Static assets: /assets/* -> gzipped, cached 1 year
# API calls: /api/* -> proxy to :3000
# SPA: /* -> index.html (client-side routing)

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  client_max_body_size 20M;

  # Gzip compression
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml text/javascript
             application/json application/javascript application/xml+rss
             application/rss+xml font/truetype font/opentype
             application/vnd.ms-fontobject image/svg+xml;
  gzip_disable "msie6";

  # Security headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  # Rate limiting
  limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;

  server {
    listen 80 default_server;
    server_name _;

    # Health check endpoint (no logs, no rate limit)
    location /health {
      access_log off;
      return 200 "OK\n";
      add_header Content-Type text/plain;
    }

    # API proxy
    location /api/ {
      limit_req zone=api burst=20 nodelay;

      proxy_pass http://api:3000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $server_name;

      proxy_connect_timeout 60s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;

      # No cache API responses
      proxy_no_cache 1;
      proxy_cache_bypass 1;
    }

    # Static assets: cache for 1 year
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
      limit_req zone=general burst=50 nodelay;

      expires 1y;
      add_header Cache-Control "public, immutable";
      access_log off;
    }

    # SPA: serve index.html for unknown routes (client-side routing)
    location / {
      limit_req zone=general burst=20 nodelay;

      # Serve files if they exist
      try_files $uri $uri/ /index.html;

      # Don't cache HTML (should be served fresh)
      add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # Security: deny access to hidden files and directories
    location ~ /\. {
      deny all;
      access_log off;
      log_not_found off;
    }

    # Error pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
      root /usr/share/nginx/html;
      internal;
    }
  }
}
